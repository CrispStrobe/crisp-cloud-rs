name: Release cloud crates

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the three crates to crates.io and create the GitHub release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Check tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
      - name: Check formatting and manifests
        run: |
          cargo fmt --all -- --check
          cargo metadata --format-version 1 --locked >/dev/null
      - name: Package all crates
        run: cargo package --workspace --locked
      - name: Verify package metadata and licenses
        run: |
          for package in crisp-cloud-rs crisp-internxt crisp-filen; do
            cargo info "$package" --registry crates-io >/dev/null 2>&1 || true
          done
          test "$(rg -l 'MPL-2.0' Cargo.toml crates/*/Cargo.toml | wc -l)" -ge 3
          rg -q 'cargo install crisp-internxt' README.md
          rg -q 'cargo install crisp-filen' README.md

  publish:
    name: Publish crates and GitHub release
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.publish == true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish provider crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo publish -p crisp-internxt --locked
          sleep 30
          cargo publish -p crisp-filen --locked
          sleep 30
          cargo publish -p crisp-cloud-rs --locked
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
