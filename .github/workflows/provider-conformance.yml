name: Dart and Rust provider conformance
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pointycastle: ['^3.7.3', '^4.0.0']
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            conformance/rust -> target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.0
      - name: Test the compatibility gate
        run: python -m unittest discover -s conformance -p 'test_*.py' -v
      - name: Cross-language golden and interoperability tests
        run: python conformance/run.py --pointycastle '${{ matrix.pointycastle }}'
      - name: Existing hermetic Rust package tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-targets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-conformance-pc${{ matrix.pointycastle }}
          path: |
            conformance/results/
            conformance/dart/pubspec.lock
            conformance/rust/Cargo.lock
          retention-days: 14
