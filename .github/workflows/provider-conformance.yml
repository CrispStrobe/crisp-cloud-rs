name: Dart and Rust provider conformance
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: provider-conformance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # SDK lockfile combination and the app lockfile combination.
          - pointycastle: '3.9.1'
            dart_pg: '2.0.0'
          - pointycastle: '4.0.0'
            dart_pg: '2.1.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/filen-dart
          ref: 1e2d6d6ec890ada798101c2ce4d5060ab33b9d33
          path: sdk/filen
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/internxt-dart
          ref: d538742eac22e0c1aa49956c098e62d9851ce4d6
          path: sdk/internxt
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            conformance/rust -> target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.0
      - name: Test the compatibility gate
        run: python -m unittest discover -s conformance -p 'test_*.py' -v
      - name: Cross-language golden and interoperability tests
        run: python conformance/run.py --pointycastle '${{ matrix.pointycastle }}' --dart-pg '${{ matrix.dart_pg }}' --dart-filen sdk/filen --dart-internxt sdk/internxt
      - name: Existing hermetic Rust package tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-targets
      - name: Existing hermetic Dart package tests
        if: ${{ !cancelled() }}
        env:
          POINTYCASTLE_VERSION: ${{ matrix.pointycastle }}
          DART_PG_VERSION: ${{ matrix.dart_pg }}
          DART_TEST_SKIP_LIVE: '1'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          for package in ['filen', 'internxt']:
              Path('sdk', package, 'pubspec_overrides.yaml').write_text(json.dumps({'dependency_overrides': {'pointycastle': os.environ['POINTYCASTLE_VERSION'], 'dart_pg': os.environ['DART_PG_VERSION']}}))
          PY
          cd sdk/filen
          dart pub get
          dart test --exclude-tags=live
          cd ../internxt
          dart pub get
          dart test --exclude-tags=live
      - name: Capture formatter output for the source probes
        if: ${{ !cancelled() }}
        run: |
          cargo fmt --all
          cargo fmt --manifest-path conformance/rust/Cargo.toml
          dart format conformance/dart/bin/probe.dart
          mkdir -p conformance/results
          git diff --output=conformance/results/format.patch -- crates conformance/dart/bin conformance/rust/src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-conformance-pc${{ matrix.pointycastle }}
          path: |
            conformance/results/
            conformance/dart/pubspec.lock
            conformance/rust/Cargo.lock
          retention-days: 14
